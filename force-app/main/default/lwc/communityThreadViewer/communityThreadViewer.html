<template>
    <div class="container">
        <p class="aksel-body-long aksel-body-long--medium">{inboxType}</p>
        <h1 class="aksel-heading aksel-heading--xlarge">{inboxTheme}</h1>
        <div class="text-area">
            <c-ds-error-summary error-list={errorList} onclickedevent={handleErrorClick} class="errorSummary">
            </c-ds-error-summary>
        </div>
        <template lwc:if={showSpinner}>
            <div class="spinner-container">
                <c-ds-loader size="3xlarge" title="Avslutter samtalen. Vennligst vent."></c-ds-loader>
            </div>
        </template>
        <template lwc:elseif={showCloseButton}>
            <template lwc:if={canReply}>
                <div class="end-dialogue-container">
                    <p class="aksel-body-long aksel-body-long--large">
                        Vi ser at du allerede har tre åpne meldinger på dette temaet . Hvis du vil opprette en ny
                        samtale, må du derfor avslutte en av de du allerede har.
                    </p>
                    <p class="aksel-body-long aksel-body-long--large subtitle">Ønsker du å avslutte denne samtalen?</p>
                    <button
                        data-variant="secondary"
                        class="aksel-button aksel-button--medium close-button"
                        aria-disabled="false"
                        onclick={handleClick}
                    >
                        <span class="aksel-label"> Avslutt samtalen </span>
                    </button>
                </div>
            </template>
        </template>
        <template lwc:if={representationLabel}>
            <div class="representation-banner aksel-body-long aksel-body-long--medium">{representationLabel}</div>
        </template>
        <c-community-message-container message-groups={messageGroups}></c-community-message-container>
        <template lwc:if={readStateError}>
            <c-ds-alert alert-type="danger" alert-text={readStateError}></c-ds-alert>
        </template>
        <slot name="messageArea">
            <template lwc:if={replyContextError}>
                <c-ds-alert alert-type="danger" alert-text={replyContextError}></c-ds-alert>
            </template>
            <template lwc:elseif={showReadOnlyNotice}>
                <c-ds-alert alert-type="info">
                    <span>
                        Bare den personen som har startet samtalen kan svare. Vil du
                        <a
                            class="aksel-link"
                            data-color="accent"
                            href="https://www.nav.no/skriv-til-oss"
                            target="_self"
                        >
                            sende en melding til Nav selv</a
                        >, kan du gjøre det her.
                    </span>
                </c-ds-alert>
            </template>
            <template lwc:elseif={closed}></template>
            <template lwc:elseif={canReply}>
                <div class="text-area">
                    <!-- TODO(backend-ready): KEEP the complete context-aware description binding when replacing context inference. -->
                    <c-ds-textarea
                        label="Ny melding"
                        max-length={maxLength}
                        description={descriptionTextArea}
                        ontextchanged={handleTextChange}
                        class="inputTextbox"
                    ></c-ds-textarea>
                </div>
                <template lwc:if={isSending}>
                    <div class="sending-message" role="status">
                        <c-ds-loader
                            size="small"
                            title="Sender melding. Vennligst vent."
                            aria-hidden="true"
                        ></c-ds-loader>
                        <span class="aksel-body-short">Sender melding. Vennligst vent.</span>
                    </div>
                </template>
                <button
                    data-variant="primary"
                    disabled={buttonDisabled}
                    class="aksel-button aksel-button--medium"
                    type="submit"
                    aria-disabled={buttonDisabled}
                    aria-busy={isSending}
                    onclick={handleSendButtonClick}
                >
                    <span class="aksel-label">Send melding</span>
                </button>
                <template lwc:if={showOpenWarning}>
                    <c-ds-alert alert-type="info" alert-text={openAlertText}></c-ds-alert>
                </template>
            </template>
        </slot>
        <c-sto-end-dialogue-modal lwc:ref="childRef" onclosethread={handleCloseThread}></c-sto-end-dialogue-modal>
        <c-alertdialog
            header="Noe gikk galt"
            content="Vennligst oppdater siden og prøv på nytt"
            desktop-style="text-align: center; width: 50%;"
            mobile-style="text-align: center; max-width: 100%;"
            center-buttons
            no-cancel-button
        >
        </c-alertdialog>
    </div>
</template>
