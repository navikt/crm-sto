<template>
    <div class="container">
        <p class="aksel-body-long aksel-body-long--medium">{inboxType}</p>
        <h1 class="aksel-heading aksel-heading--xlarge">{inboxTheme}</h1>
        <div class="text-area">
            <c-ds-error-summary error-list={errorList} onclickedevent={handleErrorClick} class="errorSummary">
            </c-ds-error-summary>
        </div>
        <template lwc:if={showSpinner}>
            <div class="spinner-container">
                <svg
                    aria-labelledby="loader-_r_2_"
                    class="aksel-loader aksel-loader--3xlarge aksel-loader--neutral"
                    focusable="false"
                    viewBox="0 0 50 50"
                    preserveAspectRatio="xMidYMid"
                    data-color="neutral"
                    data-variant="neutral"
                >
                    <title id="loader-_r_2_">Venter...</title>
                    <circle
                        class="aksel-loader__background"
                        xmlns="http://www.w3.org/2000/svg"
                        cx="25"
                        cy="25"
                        r="20"
                        fill="none"
                    ></circle>
                    <circle
                        class="aksel-loader__foreground"
                        cx="25"
                        cy="25"
                        r="20"
                        fill="none"
                        stroke-dasharray="50 155"
                    ></circle>
                </svg>
            </div>
        </template>
        <template lwc:elseif={showCloseButton}>
            <div class="end-dialogue-container">
                <p class="aksel-body-long aksel-body-long--large">
                    Vi ser at du allerede har tre åpne meldinger på dette temaet . Hvis du vil opprette en ny samtale,
                    må du derfor avslutte en av de du allerede har.
                </p>
                <p class="aksel-body-long aksel-body-long--large subtitle">Ønsker du å avslutte denne samtalen?</p>
                <button
                    data-variant="secondary"
                    class="aksel-button aksel-button--medium close-button"
                    aria-disabled="false"
                    onclick={handleClick}
                >
                    <span class="aksel-label"> Avslutt samtalen </span>
                </button>
            </div>
        </template>
        <c-community-message-container message-groups={messageGroups}></c-community-message-container>
        <slot name="messageArea">
            <template lwc:if={closed}></template>
            <template lwc:else>
                <div class="text-area">
                    <c-ds-textarea
                        label="Ny melding"
                        max-length={maxLength}
                        ontextchanged={handleTextChange}
                        class="inputTextbox"
                    ></c-ds-textarea>
                </div>
                <button
                    data-variant="primary"
                    disabled={buttonDisabled}
                    class="aksel-button aksel-button--medium"
                    type="submit"
                    aria-disabled="false"
                    onclick={handleSendButtonClick}
                >
                    <span class="aksel-label">Send melding</span>
                </button>
                <template lwc:if={showOpenWarning}>
                    <c-ds-alert alert-type="info" alert-text={openAlertText}></c-ds-alert>
                </template>
            </template>
        </slot>
        <c-sto-end-dialogue-modal lwc:ref="childRef" onclosethread={handleCloseThread}></c-sto-end-dialogue-modal>
        <c-alertdialog
            header="Noe gikk galt"
            content="Vennligst oppdater siden og prøv på nytt"
            desktop-style="text-align: center; width: 50%;"
            mobile-style="text-align: center; max-width: 100%;"
            center-buttons
            no-cancel-button
        >
        </c-alertdialog>
    </div>
</template>
