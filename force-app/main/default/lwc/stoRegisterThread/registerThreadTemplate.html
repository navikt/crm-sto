<template>
    <template lwc:if={showBTOConfirmation}>
        <c-community-confirmation
            title={btoConfirmationTitle}
            text="Vi kontakter deg hvis vi trenger mer informasjon"
        ></c-community-confirmation>
    </template>
    <template lwc:else>
        <div class="container">
            <p class="aksel-body-long aksel-body-long--medium">{title}</p>
            <h1 class="aksel-heading aksel-heading--xlarge header">{themeToShow}</h1>
            <template lwc:if={showSelectedPerson}>
                <div class="represented-person-banner" tabindex="-1">
                    <p class="aksel-body-short aksel-body-short--medium">
                        <strong>Gjelder: {selectedPersonLabel}</strong>
                    </p>
                </div>
            </template>
            <div class="errorBox">
                <c-ds-error-summary error-list={errorList} onclickedevent={handleErrorClick} class="errorSummary">
                </c-ds-error-summary>
            </div>
            <!-- TODO(backend-ready): Surface optional lookup failure without hiding the authenticated user's own form. -->
            <template lwc:if={showRepresentationLoadError}>
                <p role="alert" class="aksel-body-long aksel-body-long--medium">
                    Vi kunne ikke hente hvem du kan skrive på vegne av. Oppdater siden og prøv på nytt. Du kan fortsatt
                    skrive på vegne av deg selv hvis du ikke har valgt et barn.
                </p>
            </template>
            <!-- Show spinner -->
            <template lwc:if={shouldShowSpinner}>
                <div class="spinner-container">
                    <svg
                        tabindex="0"
                        aria-labelledby="loader-aksel-id-4"
                        class="aksel-loader aksel-loader--3xlarge aksel-loader--neutral spinner"
                        focusable="false"
                        viewBox="0 0 50 50"
                        preserveAspectRatio="xMidYMid"
                    >
                        <title id="loader-aksel-id-4">{spinnerText}</title>
                        <circle
                            class="aksel-loader__background"
                            xmlns="http://www.w3.org/2000/svg"
                            cx="25"
                            cy="25"
                            r="20"
                            fill="none"
                        ></circle>
                        <circle
                            class="aksel-loader__foreground"
                            cx="25"
                            cy="25"
                            r="20"
                            fill="none"
                            stroke-dasharray="50 155"
                        ></circle>
                    </svg>
                </div>
            </template>

            <template lwc:elseif={showPersonSelection}>
                <lightning-formatted-rich-text
                    class="aksel-body-long aksel-body-long--large"
                    value={ingressLabel}
                ></lightning-formatted-rich-text>
                <div class="person-selection-panel">
                    <c-ds-combobox
                        label="Hvem vil du skrive melding på vegne av?"
                        options={personOptions}
                        value={selectedPersonValue}
                        required
                        invalid={personSelectionInvalid}
                        error-message={personSelectionError}
                        onselectionchange={handlePersonChange}
                    ></c-ds-combobox>
                </div>

                <button
                    type="button"
                    data-variant="primary"
                    class="aksel-button aksel-button--medium"
                    onclick={handlePersonNext}
                >
                    <span class="aksel-label">Neste</span>
                </button>
            </template>

            <template lwc:elseif={threadLoadFailed}>
                <p role="alert" class="aksel-body-long aksel-body-long--medium">
                    Vi kunne ikke hente samtalene dine. Oppdater siden og prøv på nytt.
                </p>
            </template>

            <!-- Show textarea -->
            <template lwc:elseif={shouldShowTextArea}>
                <lightning-formatted-rich-text
                    class="aksel-body-long aksel-body-long--large"
                    value={ingressLabel}
                ></lightning-formatted-rich-text>
                <div class="aksel-accordion">
                    <template for:each={newsList} for:item="news">
                        <c-community-expandable-panel title={news.header} key={news.id}>
                            <lightning-formatted-rich-text
                                class="aksel-body-long aksel-body-long--medium"
                                value={news.body}
                            ></lightning-formatted-rich-text>
                        </c-community-expandable-panel>
                    </template>
                </div>
                <!-- Theme Choice Radio Button -->
                <template lwc:if={showThemeRadioButton}>
                    <div class="theme-radio-button">
                        <c-ds-radio
                            lwc:ref="themeRadioButton"
                            title={themeRadioButtonText}
                            options={radioButtonOptions}
                            class="themeRadioButton"
                            onradiochange={handleThemeRadioButtonChange}
                        >
                            <div slot="legend">
                                <p>{themeRadioButtonText}</p>
                            </div>
                        </c-ds-radio>
                    </div>
                </template>
                <!-- Textarea -->
                <template lwc:if={showInputTextArea}>
                    <div class="text-area">
                        <!-- TODO(backend-ready): KEEP both separated notices and their selected-person context. -->
                        <c-ds-textarea
                            label="Din melding"
                            max-length={maxLength}
                            description={descriptionTextArea}
                            class="inputTextbox"
                            ontextchanged={handleTextChange}
                        ></c-ds-textarea>
                    </div>
                </template>
                <!-- Medskriv radiobutton -->
                <div class="medskriv-radio-button">
                    <c-ds-radio
                        lwc:ref="medskrivRadiobuttons"
                        title="Godtar du at vi kan bruke samtalen din til opplæring av veiledere i Nav?"
                        options={medskrivOptions}
                        class="medskriv"
                        onradiochange={handleRadioChange}
                    >
                        <div slot="legend" class="slds-grid">
                            <p>Godtar du at vi kan bruke samtalen din til opplæring av veiledere i Nav?</p>
                        </div>
                    </c-ds-radio>
                </div>
                <c-ds-read-more
                    title="Grunnen til at vi spør om samtykke  til opplæring"
                    content="For å lære opp nye veiledere og utvikle oss kan vi noen ganger være to personer som ser og svarer på meldingen din. Personen som ser samtalen på grunn av opplæring eller utvikling har også taushetsplikt."
                >
                </c-ds-read-more>
                <!-- Vilkår checkbox -->
                <div class="slds-grid slds-wrap vilkar-container">
                    <c-ds-checkbox
                        label-text={labels.ACCEPT_TERM_TEXT}
                        oncheckedchanged={handleChecked}
                        class="checkboxContainer"
                    ></c-ds-checkbox>
                    <button onclick={showTerms} class="aksel-link vilkar-link" tabindex="0">
                        <span class="aksel-label">{labels.SHOW_TERM_TEXT}</span>
                    </button>
                </div>
                <button
                    data-variant="primary"
                    class="aksel-button aksel-button--medium"
                    type="submit"
                    aria-disabled="false"
                    onclick={submitRequest}
                >
                    <span class="aksel-label"> Send melding </span>
                </button>
            </template>

            <!-- Show active threads -->
            <template lwc:elseif={shouldShowThreads}>
                <p class="aksel-body-long aksel-body-long--large">{openThreadText}</p>
                <template lwc:if={showSendSTOButton}>
                    <button
                        data-variant="primary"
                        class="aksel-button aksel-button--medium send-sto-button"
                        aria-disabled="false"
                        onclick={handleSendSto}
                    >
                        <span class="aksel-label">Opprett ny samtale</span>
                    </button>
                </template>
                <h2 class="aksel-heading aksel-heading--medium subheader">
                    Dine aktive samtaler om {capitalizedCategory}
                </h2>
                <div class="inbox-list">
                    <template for:each={openThreadList} for:item="thread" for:index="index">
                        <div key={thread.recordId}>
                            <template lwc:if={canOpenMoreThreads}>
                                <c-sto-message-inbox-item
                                    thread={thread}
                                    content-type={contentType}
                                ></c-sto-message-inbox-item>
                            </template>
                            <template lwc:else>
                                <c-sto-inbox-close-item
                                    thread={thread}
                                    content-type={contentType}
                                    index={index}
                                    onclosethread={handleCloseThread}
                                ></c-sto-inbox-close-item>
                            </template>
                        </div>
                    </template>
                </div>
                <template lwc:if={showNewMessageButton}>
                    <button
                        data-variant="primary"
                        class="aksel-button aksel-button--medium new-message-button"
                        aria-disabled="false"
                        onclick={handleShowTextArea}
                    >
                        <span class="aksel-label">Skriv ny melding</span>
                    </button>
                </template>
            </template>

            <!-- Modal and alert dialog -->
            <c-ds-modal show-modal={modalOpen} modal-header={labels.SERVICE_TERMS_HEADER}>
                <div slot="modalContent">
                    <form>
                        <div class="aksel-body-long aksel-body-long--medium">
                            <lightning-formatted-rich-text value={termsContentText}></lightning-formatted-rich-text>
                        </div>
                    </form>
                </div>
                <div slot="modalFooter" class="aksel-modal__footer">
                    <button
                        data-variant="primary"
                        class="aksel-button aksel-button--medium button-width"
                        onclick={termsAccepted}
                        type="submit"
                    >
                        <span class="aksel-label">{labels.ACCEPT_TERMS_BUTTON}</span>
                    </button>
                    <button
                        data-variant="secondary"
                        class="aksel-button aksel-button--medium button-width"
                        type="submit"
                        onclick={termsDenied}
                    >
                        <span class="aksel-label">{labels.DENY_TERMS_BUTTON}</span>
                    </button>
                </div>
            </c-ds-modal>
            <c-alertdialog
                header="Noe gikk galt"
                content="Vennligst oppdater siden og prøv på nytt"
                desktop-style="text-align: center; width: 50%;"
                mobile-style="text-align: center; max-width: 100%;"
                center-buttons="true"
                no-cancel-button="true"
            >
            </c-alertdialog>
        </div>
    </template>
</template>
