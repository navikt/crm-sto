<template>
    <div class="container">
        <c-sto-medskriv-samtykke record-id={recordId}></c-sto-medskriv-samtykke>
        <c-community-alert alert-type="info" alert-text={infoText}></c-community-alert>
        <template lwc:if={showSurveyButton}>
            <div class="survey-container">
                <h2 class="aksel-heading aksel-heading--small aksel-typo--spacing">
                    Vi ønsker å lære av din opplevelse. Har du tid til å svare på to spørsmål?
                </h2>
                <div class="survey-row">
                    <button data-variant="primary" class="aksel-button aksel-button--medium" onclick={navigateToSurvey}>
                        <span class="aksel-label"> Klikk her for å svare </span>
                    </button>
                    <span class="aksel-body-short aksel-body-short--medium survey-span"
                        >Din tilbakemelding er anonym.</span
                    >
                </div>
            </div>
        </template>
    </div>
</template>
