<template>
    <div style="margin-bottom: 4rem">
        <div>
            <div class="header">
                <h1 class="aksel-heading aksel-heading--xlarge">{title}</h1>
            </div>
            <div class="text-center sizeAround">
                <template lwc:if={loading}>
                    <svg
                        aria-labelledby="loader-_r_2_"
                        class="aksel-loader aksel-loader--3xlarge aksel-loader--neutral"
                        focusable="false"
                        viewBox="0 0 50 50"
                        preserveAspectRatio="xMidYMid"
                        data-color="neutral"
                        data-variant="neutral"
                    >
                        <title id="loader-_r_2_">Venter...</title>
                        <circle
                            class="aksel-loader__background"
                            xmlns="http://www.w3.org/2000/svg"
                            cx="25"
                            cy="25"
                            r="20"
                            fill="none"
                        ></circle>
                        <circle
                            class="aksel-loader__foreground"
                            cx="25"
                            cy="25"
                            r="20"
                            fill="none"
                            stroke-dasharray="50 155"
                        ></circle>
                    </svg>
                </template>
                <template lwc:else>
                    <template lwc:if={hasNavTask}>
                        <p style="margin: 1.5rem" aria-live="polite">
                            Takk for informasjonen. Vi tar kontakt hvis vi trenger flere opplysninger fra deg.
                            <br />
                            <br />
                            Trenger du å endre på informasjonen som du allerede har sendt inn, ber vi om at du&nbsp;
                            <a href="https://www.nav.no/kontaktoss" target="_self">kontakter oss</a>. Du finner&nbsp;
                            <a href="https://www.nav.no/saksbehandlingstider#foreldrepenger" target="_self"
                                >saksbehandlingstiden på nav.no</a
                            >
                            &nbsp;eller i brev fra Nav.
                        </p>
                    </template>
                    <template lwc:else>
                        <div class="descholder slds-var-m-bottom_large">
                            <p class="aksel-body-short aksel-body-short--small blokk-xs description">
                                For at vi skal kunne vurdere saken på nytt, ber vi om at du fyller ut dette skjemaet. Du
                                blir kontaktet hvis vi trenger flere opplysninger fra deg.
                            </p>
                        </div>
                        <div class="text-start addMargin aksel-form-field aksel-form-field--medium">
                            <c-ds-error-summary
                                error-list={errorList}
                                onclickedevent={handleErrorClick}
                                class="errorSummary"
                                style="text-align: left"
                            >
                            </c-ds-error-summary>
                            <div class="childWrap">
                                <template for:each={childList} for:item="child">
                                    <div key={child} class="spacing">
                                        <c-nks-fedrekvotesaken-child
                                            data-id={child}
                                            class="children"
                                        ></c-nks-fedrekvotesaken-child>
                                    </div>
                                </template>
                            </div>
                            <button
                                data-variant="tertiary"
                                class="aksel-button aksel-button--medium"
                                type="button"
                                onbuttonclick={addChild}
                            >
                                <span class="aksel-label"> Legg til et barn til </span>
                            </button>
                            <c-ds-text-field
                                type="tel"
                                maxlength="12"
                                class="phone-number"
                                required="true"
                                label="Ditt telefonnummer"
                            ></c-ds-text-field>
                            <button
                                data-variant="primary"
                                class="aksel-button aksel-button--medium"
                                type="button"
                                onbuttonclick={validateInputs}
                            >
                                <span class="aksel-label"> Send </span>
                            </button>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </div>
</template>
