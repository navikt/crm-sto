<template>
    <a class={panelClass} href={linkUrl} target="_self" onclick={handleNavigation} aria-label={linkSummary}>
        <div class="slds-grid text-padding align-status-row">
            <div class="slds-col slds-grow no-wrap-date">
                <lightning-formatted-date-time
                    value={thread.latestMessageDate}
                    month="long"
                    day="2-digit"
                    year="numeric"
                    hour="2-digit"
                    minute="2-digit"
                    class="aksel-body-short aksel-body-short--medium"
                ></lightning-formatted-date-time>
            </div>
            <div class="status-container">
                <template lwc:if={showReadStatus}>
                    <span
                        data-color="info"
                        data-variant="outline"
                        class="aksel-tag aksel-tag--medium aksel-body-short aksel-body-short--medium"
                        >{unreadMessage}</span
                    >
                </template>
                <template lwc:if={showStatus}>
                    <span
                        data-color={statusDataColor}
                        data-variant="outline"
                        class="aksel-tag aksel-tag--medium aksel-body-short aksel-body-short--medium"
                        >{statusText}</span
                    >
                </template>
            </div>
        </div>
        <template lwc:if={inboxSenderLabel}>
            <p class="aksel-body-short aksel-body-short--medium slds-var-p-bottom_x-small">{inboxSenderLabel}</p>
        </template>
        <template lwc:elseif={senderContextLoadFailed}>
            <p role="status" class="aksel-body-short">Informasjon om hvem som startet samtalen kunne ikke hentes.</p>
        </template>
        <h3 class="aksel-heading--small aksel-typo--semibold slds-var-p-bottom_x-small item-title">{itemTitle}</h3>
        <p class="aksel-body-long--large aksel-typo--regular message-box">{latestText}</p>
        <template lwc:if={showReadStateError}>
            <p role="status" class="aksel-body-short">Lesestatus kunne ikke hentes.</p>
        </template>
    </a>
    <slot name="endDialogue"></slot>
</template>
